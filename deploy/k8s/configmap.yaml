apiVersion: v1
kind: ConfigMap
metadata:
  name: dip-config
  namespace: dip-production
  labels:
    app.kubernetes.io/name: document-intelligence-platform
data:
  APP_ENV: "production"
  APP_NAME: "document-intelligence-platform"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  POSTGRES_HOST: "dip-postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "document_intelligence"
  REDIS_HOST: "dip-redis-service"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "dip-rabbitmq-service"
  RABBITMQ_PORT: "5672"
  MINIO_ENDPOINT: "dip-minio-service:9000"
  QDRANT_HOST: "dip-qdrant-service"
  PROMETHEUS_ENABLED: "true"
  OPENTELEMETRY_ENABLED: "true"
  RATE_LIMITING_ENABLED: "true"
