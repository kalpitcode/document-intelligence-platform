apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dip-redis
  namespace: dip-production
  labels:
    app.kubernetes.io/name: document-intelligence-platform
    app.kubernetes.io/component: cache
spec:
  serviceName: dip-redis-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intelligence-platform
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intelligence-platform
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dip-redis-service
  namespace: dip-production
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app.kubernetes.io/name: document-intelligence-platform
    app.kubernetes.io/component: cache
