apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dip-ingress
  namespace: dip-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dip.blackrock.com
      secretName: dip-tls-secret
  rules:
    - host: dip.blackrock.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dip-api-service
                port:
                  number: 80
