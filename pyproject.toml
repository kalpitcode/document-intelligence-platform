[tool.poetry]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Enterprise AI Document Intelligence Platform — Built on the Aladdin architecture principles"
authors = ["BlackRock Engineering <engineering@blackrock.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"

# --- Core Framework ---
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"

# --- Database ---
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
greenlet = "^3.1.0"

# --- Cache ---
redis = { version = "^5.2.0", extras = ["hiredis"] }

# --- Messaging ---
aio-pika = "^9.5.0"

# --- Workers ---
celery = { version = "^5.4.0", extras = ["redis"] }

# --- HTTP ---
httpx = "^0.28.0"

# --- Security & Auth ---
argon2-cffi = "^23.1.0"
pyjwt = { version = "^2.10.0", extras = ["crypto"] }
email-validator = "^2.1.0"
aiosqlite = "^0.20.0"

# --- Utilities ---
python-dotenv = "^1.0.1"
orjson = "^3.10.0"
python-multipart = "^0.0.18"
aiofiles = "^24.1.0"
python-magic = "^0.4.27"
minio = "^7.2.10"

# --- Document Processing & OCR ---
pymupdf = "^1.25.1"
pdfplumber = "^0.11.4"
pytesseract = "^0.3.13"
pillow = "^11.0.0"
python-docx = "^1.1.2"
unstructured = "^0.16.11"
langdetect = "^1.0.9"
beautifulsoup4 = "^4.12.3"

# --- Embeddings & Vector Search ---
qdrant-client = "^1.12.0"
sentence-transformers = "^3.3.0"
rank-bm25 = "^0.2.2"

# --- Observability ---
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
# --- Testing ---
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.5.0"
httpx = "^0.28.0"
factory-boy = "^3.3.0"
faker = "^33.0.0"

# --- Linting & Formatting ---
ruff = "^0.8.0"
black = "^24.10.0"
isort = "^5.13.0"
mypy = "^1.13.0"

# --- Pre-commit ---
pre-commit = "^4.0.0"

# --- Development ---
ipython = "^8.29.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ==============================================================================
# Tool Configuration
# ==============================================================================

[tool.black]
line-length = 99
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 99
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "ERA",  # eradicate (commented code)
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "S101",   # use of assert (needed in tests)
    "RUF012", # mutable class variable annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"migrations/**/*.py" = ["ERA001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--no-header",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require infrastructure)",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "aio_pika.*", "redis.*"]
ignore_missing_imports = true
